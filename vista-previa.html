  'use strict';
  function score(questions, answers) {
    return Array.from({length:12},(_,axis)=>{
      const qs=questions.filter(q=>q.axis===axis && Number.isInteger(answers[q.id]) && Math.abs(answers[q.id])<=2);
      return qs.length ? Math.round(50+25*qs.reduce((s,q)=>s+answers[q.id]*q.direction,0)/qs.length) : null;
    });
  }
  function match(scores, profile, weights=Array(12).fill(1)) {
    const axes=scores.map((v,i)=>i).filter(i=>scores[i]!==null && profile.values[i]!==null && weights[i]>0);
    if(axes.length<3) return null;
    const total=axes.reduce((s,i)=>s+weights[i],0);
    const distance=axes.reduce((s,i)=>s+Math.abs(scores[i]-profile.values[i])*weights[i],0)/total;
    return {similarity:Math.round(100-distance),coverage:axes.length,axes};
  }
  function rank(scores, profiles, weights) {
    return profiles.map(profile=>({profile,...match(scores,profile,weights)})).filter(x=>x.similarity!==undefined).sort((a,b)=>b.similarity-a.similarity||b.coverage-a.coverage||a.profile.name.localeCompare(b.profile.name,'es'));
  }
  const api={score,match,rank};
  if(typeof module!=='undefined'&&module.exports) module.exports=api; else root.AxisCore=api;
})(typeof window!=='undefined'?window:globalThis);

</script><script>(()=>{
 'use strict';
 const D=window.AXIS_DATA,C=window.AxisCore,main=document.querySelector('main');
 const KEY='espana-12-ejes-v1'; let state=null,weights=Array(12).fill(1),search='',filter='all',activeComparison=null;
 const questions=mode=>D.bank.flatMap((bank,axis)=>bank.slice(0,mode==='short'?3:5).map(([text,direction],i)=>({id:`${axis}-${i}`,axis,text,direction}))).sort((a,b)=>Number(a.id.split('-')[1])-Number(b.id.split('-')[1])||a.axis-b.axis);
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const initials=s=>s.split(' ').filter(w=>!['Núñez','Ramón','Torres'].includes(w)).slice(0,2).map(w=>w[0]).join('');
 const avatar=p=>`<span class="avatar" style="background:${p.color}" aria-hidden="true">${initials(p.name)}</span>`;
 const person=p=>`<div class="person">${avatar(p)}<div><h3>${esc(p.name)}</h3><small>${esc(p.role)}</small></div></div>`;
 const notice='<p class="notice">Edición inicial. Las afinidades son estimaciones editoriales, no mediciones científicas ni recomendaciones de voto. Los programas de 2023 no se presentan como programas de noviembre de 2026. El catálogo no representa todas las candidaturas.</p>';
 function read(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s||s.version!==D.version||!['short','full'].includes(s.mode))return null;const q=questions(s.mode);if(!Number.isInteger(s.index)||s.index<0||s.index>=q.length||typeof s.answers!=='object'||s.answers===null||Array.isArray(s.answers))return null;const answers={};q.forEach(x=>{if(Number.isInteger(s.answers[x.id])&&Math.abs(s.answers[x.id])<=2)answers[x.id]=s.answers[x.id]});return {...s,answers};}catch{return null}}
 function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('No se pudo guardar el progreso. Puedes continuar en esta pestaña.')}}
 function toast(text){const el=document.querySelector('#toast');el.textContent=text;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',4500)}
 function go(route){if(location.hash===route)render();else location.hash=route}
 function focusHeading(){const h=main.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}
 function start(mode){state={version:D.version,mode,index:0,answers:{},completed:false};weights=Array(12).fill(1);activeComparison=null;save();go('#preguntas')}
 function bars(scores,compare){return D.axes.map((a,i)=>`<div class="axis-row"><div class="axis-name"><span>${String(i+1).padStart(2,'0')} · ${a[0]}</span><span>${scores[i]===null?'Sin respuesta':`${scores[i]}/100`}</span></div><div class="axis-bar"><span style="width:${scores[i]??50}%;${scores[i]===null?'background:#a9b0b3':''}"></span>${compare&&compare.values[i]!==null?`<span title="${esc(compare.name)}: ${compare.values[i]}" style="position:absolute;left:calc(${compare.values[i]}% - 3px);top:-4px;width:6px;height:16px;background:var(--blue)"></span>`:''}</div><div class="axis-labels"><span>${a[1]}</span><span>${a[2]}</span></div></div>`).join('')}
 function compass(scores){const x=scores?(scores[7]+scores[8])/2:68;const y=scores?scores[10]:32;return `<svg class="compass" viewBox="0 0 400 250" role="img" aria-label="Mapa orientativo: economía ${Math.round(x)} de 100 hacia mercado; valores ${y} de 100 hacia continuidad"><rect x="50" y="26" width="300" height="185" fill="none" stroke="#5c6b72"/><path d="M200 26V211M50 119H350" stroke="#697780" stroke-dasharray="4 5"/><text x="200" y="18" text-anchor="middle" fill="#c4cdd0" font-size="10">MÁS CONTINUIDAD SOCIAL</text><text x="200" y="237" text-anchor="middle" fill="#c4cdd0" font-size="10">MÁS CAMBIO SOCIAL</text><text x="55" y="113" fill="#c4cdd0" font-size="9">ESTADO</text><text x="345" y="113" text-anchor="end" fill="#c4cdd0" font-size="9">MERCADO</text><circle cx="${50+x*3}" cy="${211-y*1.85}" r="19" fill="#ed9575" opacity=".16"/><circle cx="${50+x*3}" cy="${211-y*1.85}" r="7" fill="#f0906b"/><path d="M${50+x*3-12} ${211-y*1.85}h24M${50+x*3} ${211-y*1.85-12}v24" stroke="#f0906b"/></svg>`}
 function home(){main.innerHTML=`<section class="hero"><div><div class="eyebrow">Tus ideas tienen coordenadas</div><h1>Más allá de<br>izquierda<br>y <em>derecha.</em></h1><p>Descubre cómo piensas en 12 dimensiones. Y con qué figuras de la política y la sociedad española compartes más ideas.</p><div class="actions"><a class="button" href="#test">Encontrar mis coordenadas <span>↗</span></a><a class="text-button" href="#catalogo">Explorar personalidades</a></div><p class="micro">Sin cuenta · Respuestas en tu navegador · 5–10 minutos</p></div><aside class="sample"><div class="sample-top"><span>UN MAPA, MUCHOS MATICES</span><span>ES / 12</span></div><h3>No eres una etiqueta.</h3><p>Dos personas pueden coincidir en economía y discrepar en valores.</p>${compass()}<div class="sample-bottom"><span>12 dimensiones independientes</span><span>Ejemplo ilustrativo ↗</span></div></aside></section><div class="election"><span><strong>29 NOV 2026</strong> · Elecciones generales · Una conversación con más contexto.</span><a href="https://www.ine.es/dyngs/Prensa/es/EG2026.htm" target="_blank" rel="noopener noreferrer">Consultar convocatoria en el INE ↗</a></div><section class="section"><div class="section-top"><h2>Primero tus ideas.<br>Después los nombres.</h2><p>Responde sin logos ni siglas. Mira los puntos de encuentro, las diferencias y las fuentes detrás de cada perfil.</p></div><div class="steps"><article class="card"><span class="step-num">01 /</span><h3>Toma posición</h3><p>Vivienda, impuestos, libertades, autonomías… Afirmaciones concretas, con cinco niveles de acuerdo.</p></article><article class="card"><span class="step-num">02 /</span><h3>Lee tus 12 ejes</h3><p>Un mapa de preferencias. Puedes querer menos impuestos y más apertura social, o combinar otras prioridades.</p></article><article class="card"><span class="step-num">03 /</span><h3>Compara con criterio</h3><p>Figuras españolas, cobertura visible y fuentes públicas. La afinidad ayuda a explorar; tú decides qué te importa.</p></article></div></section><section class="section"><div class="section-top"><h2>Doce formas de mirar España.</h2><a class="text-button" href="#metodo">Entender el método ↗</a></div><div class="axis-grid">${D.axes.map((a,i)=>`<article class="axis-card"><small>${String(i+1).padStart(2,'0')} /</small><h3>${a[0]}</h3><p>${a[1]}<br>↔ ${a[2]}</p></article>`).join('')}</div></section><section class="section">${notice}</section>`}
 function choose(){state=state||read();main.innerHTML=`<section class="page-head"><div class="eyebrow">Elige tu recorrido</div><h1>¿Cuánto quieres<br><em>profundizar?</em></h1><p>Los dos tests recorren los 12 ejes. El completo incorpora más afirmaciones por dimensión; no garantiza mayor exactitud científica.</p></section>${state?`<div class="resume"><p><b>Tienes ${state.completed?'un resultado guardado':'un test empezado'}.</b><br><small>${Object.keys(state.answers).length} de ${questions(state.mode).length} respuestas</small></p><button class="button" data-action="resume">${state.completed?'Ver mi resultado':'Continuar'} ↗</button></div>`:''}<div class="modes"><article class="card mode"><span class="pill">PRIMERA EXPLORACIÓN</span><h3>Versión breve</h3><strong>36</strong> preguntas<p>3 por eje · unos 5 minutos</p><button class="button dark" data-start="short">Empezar breve ↗</button></article><article class="card mode"><span class="pill">MÁS MATICES</span><h3>Versión completa</h3><strong>60</strong> preguntas<p>5 por eje · unos 10 minutos</p><button class="button" data-start="full">Empezar completo ↗</button></article></div><p class="micro">Al comenzar, el progreso se guarda en este navegador para que puedas retomarlo. Un test nuevo sustituye el anterior. Puedes borrar los datos desde Privacidad. No utilizamos analítica ni enviamos tus respuestas a un servidor.</p>${notice}`}
 function quiz(){state=state||read();if(!state){go('#test');return}const qs=questions(state.mode),q=qs[state.index],value=state.answers[q.id];main.innerHTML=`<section class="quiz"><div class="quiz-meta"><span>${state.mode==='short'?'TEST BREVE':'TEST COMPLETO'} · ${state.index+1} / ${qs.length}</span><span>${Math.round(Object.keys(state.answers).length/qs.length*100)} % respondido</span></div><div class="progress" role="progressbar" aria-label="Preguntas respondidas" aria-valuemin="0" aria-valuemax="${qs.length}" aria-valuenow="${Object.keys(state.answers).length}"><span style="width:${Object.keys(state.answers).length/qs.length*100}%"></span></div><article class="question"><div class="eyebrow">${D.axes[q.axis][0]}</div><h1>${q.text}</h1><div class="answers" role="group" aria-label="Nivel de acuerdo">${[[2,'Totalmente de acuerdo'],[1,'De acuerdo'],[0,'Neutral / no tengo una posición'],[-1,'En desacuerdo'],[-2,'Totalmente en desacuerdo']].map(([v,label],i)=>`<button class="answer ${value===v?'selected':''}" aria-pressed="${value===v}" data-answer="${v}"><span>${label}</span><small>${i+1}</small></button>`).join('')}</div><p class="micro" style="margin:20px 0 0">Neutral puntúa en el centro; omitir deja la pregunta sin puntuar. Teclas 1–5 para responder.</p></article><div class="quiz-controls"><button class="button secondary" data-action="back" ${state.index===0?'disabled':''}>← Anterior</button><button class="text-button" data-action="skip">Omitir</button><button class="button dark" data-action="next" ${value===undefined?'disabled':''}>${state.index===qs.length-1?'Ver resultado':'Siguiente'} →</button></div><button class="text-button" data-action="pause">Guardar y salir</button></section>`;focusHeading()}
 function next(){const qs=questions(state.mode);if(state.index<qs.length-1){state.index++;save();quiz()}else{state.completed=true;save();go('#resultado')}}
 function card(p){const coverage=p.values.filter(v=>v!==null).length;return `<article class="card person-card">${person(p)}<p>${esc(p.basis)}</p><p class="micro">${coverage} de 12 ejes con estimación · ${coverage<3?'Sin afinidad calculable':'Perfil '+(coverage<8?'parcial':'editorial')}</p><button class="text-button" data-detail="${p.id}">Ver perfil y fuentes ↗</button></article>`}
 function catalog(){main.innerHTML=`<section class="page-head"><div class="eyebrow">Solo figuras españolas</div><h1>Personas.<br><em>No caricaturas.</em></h1><p>Seis figuras políticas y tres economistas para empezar. Cada ficha explica qué se ha estimado y qué queda sin puntuar. No son necesariamente candidatos a las próximas elecciones.</p></section><div class="filters"><input type="search" id="search" aria-label="Buscar personalidad" placeholder="Buscar por nombre o siglas…" value="${esc(search)}"><select id="filter" aria-label="Tipo de personalidad"><option value="all">Todas las figuras</option><option value="politica" ${filter==='politica'?'selected':''}>Política</option><option value="sociedad" ${filter==='sociedad'?'selected':''}>Sociedad y divulgación</option></select></div><div class="grid" id="catalog-grid"></div>${notice}`;catalogGrid()}
 function catalogGrid(){const found=D.profiles.filter(p=>(filter==='all'||p.group===filter)&&`${p.name} ${p.role}`.toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(search.toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'')));document.querySelector('#catalog-grid').innerHTML=found.length?found.map(card).join(''):'<p class="empty">No hay figuras con ese nombre o filtro.</p>'}
 function ranked(rows){return rows.length?rows.map(r=>`<article class="rank-card">${avatar(r.profile)}<div class="rank-info"><b>${r.profile.name}</b><small>${r.profile.role} · ${r.coverage}/12 ejes comparados</small></div><span class="rank-percent">${r.similarity}%</span><button data-compare="${r.profile.id}">Comparar</button></article>`).join(''):'<p class="micro">No hay suficiente información para comparar. Necesitas al menos tres ejes respondidos, documentados y con peso mayor que cero.</p>'}
 function results(){state=state||read();if(!state||!state.completed){go('#test');return}const scores=C.score(questions(state.mode),state.answers),rank=C.rank(scores,D.profiles,weights),politics=rank.filter(r=>r.profile.group==='politica'),society=rank.filter(r=>r.profile.group==='sociedad'),best=politics[0];const compare=D.profiles.find(p=>p.id===activeComparison)||null;main.innerHTML=`<section class="result-head"><div><div class="eyebrow">Tus coordenadas · ${state.mode==='short'?'36':'60'} preguntas</div><h1>Ideas con <em>matices.</em></h1><p>${Object.keys(state.answers).length} respuestas · ${scores.filter(s=>s!==null).length} ejes con datos · Sin etiquetas automáticas.</p></div><div class="actions"><button class="button dark" data-action="download">Guardar tarjeta ↓</button><button class="button secondary" data-action="json">Exportar datos ↓</button></div></section>${notice}<div class="results-layout"><div><article class="result-feature"><div class="eyebrow">Mayor afinidad política estimada</div>${best?`${person(best.profile)}<div class="match-big">${best.similarity}<span>%</span></div><p>Similitud en ${best.coverage} de 12 dimensiones, con los pesos actuales. Los perfiles con distinta cobertura no son directamente equivalentes.</p><button class="text-button" data-detail="${best.profile.id}">Ver estimación y fuentes ↗</button>`:'<h2>Aún faltan coordenadas.</h2><p>No hay tres ejes comparables con las prioridades seleccionadas.</p>'}${scores[7]!==null&&scores[8]!==null&&scores[10]!==null?compass(scores):''}<p class="micro">El mapa resume economía (media de mercado y fiscalidad) y valores sociales. No es un diagnóstico de ideología.</p></article><section class="section"><h3>Figuras políticas</h3>${ranked(politics)}<h3 style="margin-top:30px">Sociedad y divulgación</h3><p class="micro">Afinidades parciales. Se calculan en menos dimensiones; no se comparan con el ranking político.</p>${ranked(society)}<p class="micro">Juan Torres López aparece en el catálogo, pero solo tiene dos ejes documentados: no se calcula un porcentaje.</p></section></div><article class="card"><div class="section-top"><h3>${compare?'Tú y '+compare.name:'Tu perfil, eje por eje'}</h3>${compare?'<button class="text-button" data-action="reset-compare">Quitar</button>':''}</div>${compare?'<div class="legend"><span>Tú</span><span>Figura</span></div><p class="micro">Sin marcador azul = sin estimación disponible.</p>':''}${bars(scores,compare)}<p class="micro">0 corresponde al polo izquierdo; 100, al derecho. Una respuesta neutral equivale a 50; un eje omitido no cuenta.</p></article></div><details><summary>Ajustar mis prioridades</summary><p class="micro">Todos los ejes empiezan con el mismo peso. Cambiar el peso modifica la afinidad, no tus respuestas.</p><div class="weights">${D.axes.map((a,i)=>`<label>${a[0]}<select data-weight="${i}" aria-label="Prioridad de ${a[0]}">${[[0,'No contar'],[1,'Normal'],[2,'Importante'],[3,'Muy importante']].map(([v,l])=>`<option value="${v}" ${weights[i]===v?'selected':''}>${l}</option>`).join('')}</select></label>`).join('')}</div><button class="button dark" data-action="apply-weights">Actualizar afinidades</button></details><div class="actions section"><a class="button secondary" href="#test">Hacer otro test</a><a class="text-button" href="#metodo">Ver método y limitaciones</a></div>`}
 function detail(id){const p=D.profiles.find(p=>p.id===id);if(!p)return;document.querySelector('#detail-content').innerHTML=`<div class="eyebrow">Ficha editorial · ${D.reviewed}</div>${person(p)}<p class="notice">${p.basis}</p><p class="micro">Escala de 0 a 100. Cada cifra es una estimación hecha para este proyecto. «Sin datos» no significa neutral.</p>${bars(p.values)}<h3>Fuentes y trazabilidad</h3>${p.sources.map(s=>`<div class="source"><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.title} ↗</a><p>${s.note}</p><span>Ejes: ${s.axes.map(i=>D.axes[i][0]).join(', ')}</span></div>`).join('')}`;document.querySelector('#detail').showModal()}
 function method(){main.innerHTML=`<section class="page-head"><div class="eyebrow">Transparencia antes que precisión aparente</div><h1>Así se dibuja<br><em>el mapa.</em></h1><p>El código y los datos están en el proyecto descargable. No hay un modelo de IA decidiendo tus resultados ni perfiles ocultos.</p></section><article class="prose"><h2>1. Las respuestas</h2><p>Totalmente de acuerdo vale +2; de acuerdo, +1; neutral, 0; en desacuerdo, −1; totalmente en desacuerdo, −2. La dirección de cada pregunta determina a qué polo lleva el acuerdo. Cada pregunta puntúa únicamente en su eje.</p><p><b>Posición del eje = 50 + 25 × media(respuesta × dirección).</b> Las preguntas omitidas no se incluyen. Si omites un eje entero, se marca sin datos y queda fuera de la comparación.</p><h2>2. La afinidad</h2><p>Solo se usan los ejes que tienen datos tanto en tus respuestas como en el perfil, y cuyo peso es mayor que cero. Hacen falta al menos tres. Se calcula la diferencia absoluta entre las dos posiciones en cada eje.</p><p><b>Afinidad = 100 − media ponderada de las diferencias absolutas.</b> Se redondea al entero más próximo. No es probabilidad de voto ni porcentaje de acuerdo con todo lo que dice una persona. Los empates se ordenan por mayor cobertura y después por nombre.</p><h2>3. Los perfiles</h2><p>Los perfiles políticos son aproximaciones a programas colectivos de 2023. Esa sustitución del individuo por su partido es una limitación importante. Los perfiles sociales se basan en textos propios y a menudo tienen menos dimensiones documentadas. Las fuentes orientan las posiciones; no contienen las cifras que les asignamos. Los valores son hipótesis editoriales abiertas a revisión, sin validación independiente.</p><p>Los perfiles con coberturas diferentes pueden producir afinidades altas por razones distintas. Por eso se muestra siempre el número de ejes comparados y se separan política y sociedad. No hemos supuesto posiciones neutrales cuando falta evidencia.</p><h2>4. Lo que no mide</h2><p>El test no mide honestidad, competencia, calidad de gestión, viabilidad de propuestas ni integridad personal. Territorio agrupa preferencias muy diferentes, como federalismo e independentismo. La dimensión religiosa mide relaciones entre instituciones y confesiones, nunca la fe privada de una persona. Doce ejes siguen siendo una simplificación.</p><h2>5. Edición electoral</h2><p>Fecha de revisión: ${D.reviewed}. Elecciones generales: <a href="https://www.ine.es/dyngs/Prensa/es/EG2026.htm" target="_blank" rel="noopener noreferrer">29 de noviembre de 2026, según el INE</a>. El catálogo no es un listado oficial de candidatos. Antes de usar esta edición como comparador de propuestas de 2026, hay que revisar los perfiles con programas y declaraciones nuevos, ampliar la representación y documentar cada decisión de puntuación.</p><h2>6. Proyecto y atribución</h2><p>Inspirado en el concepto de <a href="https://12axes.vercel.app/" target="_blank" rel="noopener noreferrer">12 Axes</a>. Esta implementación, sus textos y preguntas son propios. No reutiliza su código ni sus datos ni está afiliada al proyecto original.</p><div class="actions"><a class="button" href="#catalogo">Consultar todas las fuentes ↗</a><a class="text-button" href="#test">Empezar el test</a></div></article>`}
 function privacy(){main.innerHTML=`<section class="page-head"><div class="eyebrow">Tus respuestas son tuyas</div><h1>Sin cuenta.<br><em>Sin rastreadores.</em></h1></section><article class="prose"><p>Esta aplicación procesa tus respuestas en el navegador. Guarda el progreso y el resultado en localStorage en este dispositivo. No incorpora analítica, píxeles publicitarios, fuentes remotas ni formularios que envíen tus respuestas. Cualquier persona con acceso a este perfil del navegador podría ver el resultado guardado.</p><p>Al visitar una web alojada en Vercel, el proveedor puede procesar datos técnicos de la petición, como la IP o los registros de acceso. Eso no implica que esta aplicación le envíe las respuestas del test. Los enlaces a fuentes abren páginas de terceros con sus propias políticas.</p><p>Las exportaciones se descargan en tu dispositivo. La tarjeta incluye las posiciones de tus ejes y una afinidad estimada; el JSON incluye también las respuestas. Tú eliges si compartes esos archivos y con quién. Borrar los datos aquí no elimina archivos que ya hayas descargado.</p><button class="button dark" data-action="clear">Borrar mi progreso y resultado</button><p class="micro" id="clear-status"></p></article>`}
 function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
 function exportCard(){const scores=C.score(questions(state.mode),state.answers),top=C.rank(scores,D.profiles.filter(p=>p.group==='politica'),weights)[0];const lines=D.axes.map((a,i)=>{const y=294+i*47;return `<text x="52" y="${y}" fill="#d1dce0" font-size="14">${esc(a[0])}</text><rect x="264" y="${y-11}" width="295" height="7" rx="3" fill="#46545c"/><rect x="264" y="${y-11}" width="${(scores[i]??0)*2.95}" height="7" rx="3" fill="#ef9979"/><text x="610" y="${y}" fill="#f5f2eb" text-anchor="end" font-size="14">${scores[i]===null?'—':scores[i]}</text>`}).join('');const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="660" height="970" viewBox="0 0 660 970"><rect width="660" height="970" rx="24" fill="#17232d"/><g font-family="Arial,sans-serif"><text x="52" y="58" fill="#ef9979" font-size="13" letter-spacing="2">ESPAÑA EN 12 EJES</text><text x="52" y="118" fill="#f5f2eb" font-size="38" font-family="Georgia,serif">Mis ideas tienen matices.</text><text x="52" y="165" fill="#bdc9ce" font-size="13">Afinidad política editorial · ${top?top.coverage:0}/12 ejes comparados</text><text x="52" y="215" fill="#f5f2eb" font-size="27">${top?esc(top.profile.name)+' · '+top.similarity+'%':'Sin afinidad calculable'}</text>${lines}<text x="52" y="878" fill="#bdc9ce" font-size="11">0 = polo izquierdo · 100 = polo derecho · — = sin respuesta</text><text x="52" y="903" fill="#bdc9ce" font-size="11">Estimación exploratoria. No es recomendación de voto.</text><text x="52" y="928" fill="#bdc9ce" font-size="11">Fuentes de 2023 y textos propios · Edición 0.1 · Pesos personalizados: ${weights.some(w=>w!==1)?'sí':'no'}</text></g></svg>`;download(svg,'mis-coordenadas.svg','image/svg+xml');toast('Tarjeta guardada. Incluye tu perfil político; compártela solo si quieres.');}
 function render(){const route=location.hash.split('?')[0]||'#inicio';if(route==='#preguntas'){quiz();return}({'#inicio':home,'#test':choose,'#catalogo':catalog,'#resultado':results,'#metodo':method,'#privacidad':privacy}[route]||home)();window.scrollTo(0,0);focusHeading()}
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.start){start(b.dataset.start);return}if(b.dataset.detail){detail(b.dataset.detail);return}if(b.dataset.compare){activeComparison=b.dataset.compare;results();return}if(b.dataset.answer!==undefined&&state){const q=questions(state.mode)[state.index];state.answers[q.id]=Number(b.dataset.answer);save();quiz();return}switch(b.dataset.action){case 'resume':go(state.completed?'#resultado':'#preguntas');break;case 'back':if(state.index>0){state.index--;save();quiz()}break;case 'next':next();break;case 'skip':delete state.answers[questions(state.mode)[state.index].id];next();break;case 'pause':save();go('#test');break;case 'reset-compare':activeComparison=null;results();break;case 'apply-weights':document.querySelectorAll('[data-weight]').forEach(el=>weights[Number(el.dataset.weight)]=Number(el.value));results();toast('Afinidades recalculadas con tus prioridades.');break;case 'download':exportCard();break;case 'json':download(JSON.stringify({app:'España en 12 ejes',version:D.version,...state,scores:C.score(questions(state.mode),state.answers),weights},null,2),'mis-coordenadas.json','application/json');break;case 'clear':try{localStorage.removeItem(KEY);state=null;weights=Array(12).fill(1);activeComparison=null;document.querySelector('#clear-status').textContent='Datos borrados de este navegador.'}catch{toast('El navegador no permite borrar el almacenamiento. Revisa sus ajustes.')}break}});
 document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;catalogGrid()}});
 document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;catalogGrid()}});
 document.addEventListener('keydown',e=>{if(location.hash==='#preguntas'&&!document.querySelector('dialog').open&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)&&/^[1-5]$/.test(e.key)){e.preventDefault();document.querySelectorAll('[data-answer]')[Number(e.key)-1]?.click()}});
 document.querySelector('#close-dialog').addEventListener('click',()=>document.querySelector('#detail').close());
 window.addEventListener('hashchange',render);state=read();render();
})();
</script></body></html>
